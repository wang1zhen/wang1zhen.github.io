[params.homeInfoParams]
Title = "Stay Awhile and Listen.<br>英雄请留步，且听我一言。"
Content = ""

[[params.socialIcons]]
name = "github"
url = "https://github.com/wang1zhen/"

[params]
  env = "production"
  description = "wang1zhen 的个人博客，包括各种Linux、日语学习和物理相关的读书笔记等。"
  author = ["wang1zhen"]
  keywords = ["linux", "日语", "物理", "arch", "debian", "zfs", "blog"]
  ShowReadingTime = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  showtoc = true
  tocopen = true
  mainSections = ["tech", "learn"]

