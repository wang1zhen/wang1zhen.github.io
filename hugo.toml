baseURL = 'https://blog.wang1zhen.com/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = "wang1zhen's Homepage"
theme = 'PaperMod'
enableRobotsTXT = true

[markup.goldmark.renderer]
  unsafe = true

[menu]
 [[menu.main]]
    name = "技术/Tech"
    pageRef = "/tech"
    weight = 1
 [[menu.main]]
    name = "学习/Learn"
    pageRef = "/learn"
    weight = 2
 [[menu.main]]
    name = "关于/About"
    pageRef = "/about"
